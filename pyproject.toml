[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ppicker"
description = "Fast project picker for tiling window managers (i3, sway): open a project in your editor"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Roman" }]
keywords = ["project-manager", "launcher", "tui", "i3", "sway", "rofi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Rust",
  "Topic :: Software Development",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/roman-right/ppicker"

[tool.maturin]
bindings = "bin"
strip = true
