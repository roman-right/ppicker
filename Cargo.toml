[package]
name = "ppicker"
version = "0.3.0"
edition = "2024"
description = "Fast project picker for tiling window managers: open a project in your editor"
license = "MIT"
repository = "https://github.com/roman-right/ppicker"

[[bin]]
name = "pp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
which = "8.0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
