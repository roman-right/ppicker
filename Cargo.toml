[package]
name = "ppicker"
version = "0.1.0"
edition = "2024"
description = "Fast project and runner picker for tiling window managers"
license = "MIT"
repository = "https://github.com/roman-right/code_compass"

[[bin]]
name = "pp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
